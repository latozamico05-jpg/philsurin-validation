# PHILSURIN — local + cloud stack. PC can be OFF when run on a server.
# Usage:
#   Local test:  docker compose up -d --build  -> http://localhost:8080/health.php
#   Production:  copy to docker-compose.prod.yml, fill secrets, up -d
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass-change-me}
      MYSQL_DATABASE: ${DB_NAME:-philsurin}
      MYSQL_USER: ${DB_USER:-philsurin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-strong}
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpass-change-me}"]
      interval: 15s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-philsurin}
      DB_USER: ${DB_USER:-philsurin}
      DB_PASS: ${DB_PASSWORD:-change-me-strong}
      SESSION_HANDLER: files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health.php"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  dbdata:
