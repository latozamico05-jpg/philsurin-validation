# .github/workflows/deploy-docker.yml
# PHILSURIN — Automated Docker Build & Push to Docker Hub

name: PHILSURIN Docker CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - '**/app.js'
      - '**/devtunnel-proxy.js'
      - '**/config.php'
      - '**/index.php'
      - '**/dashboard.php'
      - '**/users.php'
      - '**/api/**'
      - '**/database/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: true
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/philsurin
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Built: ${{ steps.meta.outputs.tags }}"


  # Deploy to Render.com (Web Service)
  deploy-render:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Render
        run: |
          echo "Waiting for Render service to be ready..."
          # Render auto-deploys from connected GitHub repo
          echo "✅ Render.com detected GitHub push — auto-deploying"
          echo "Go to: https://dashboard.render.com — see your service"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}


  # Deploy to AWS EC2
  deploy-ec2:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to AWS EC2
        run: |
          echo "Updating EC2 instance..."
          ssh -i ${{ secrets.EC2_KEY_PATH }} \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd philsurin-validation
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker system prune -f
          EOF
        env:
          EC2_USER: ubuntu
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_KEY_PATH: ./id_rsa


  # Deploy to Railway.app
  deploy-railway:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Railway
        run: |
          echo "Waiting for Railway deployment..."
          # Railway auto-deploys from connected GitHub repo
          echo "✅ Railway.com detected GitHub push — auto-deploying"
          echo "Go to: https://dashboard.railway.app — see your service"
