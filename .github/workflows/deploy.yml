# .github/workflows/deploy.yml
# PHILSURIN — Vercel CI/CD with Status Notification

name: PHILSURIN Vercel CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.php'
      - '**/*.js'
      - '**/*.css'
      - '**/*.html'
      - '**/*.json'
      - '**/*.sql'
      - 'vercel.json'
      - 'config.php'
      - 'api/**'
      - 'database/**'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Vercel - lint
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - philsurin-validation: lint

      - name: Verify PHP syntax
        run: |
          find . -name "*.php" -exec php -l {} \; 2>/dev/null || true
          echo "✅ PHP syntax check completed"

  deploy-vercel:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_PORT: ${{ secrets.DB_PORT }}

      - name: Notify Vercel - deploy complete
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: Vercel - philsurin-validation: deploy
